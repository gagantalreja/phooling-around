<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phooling Around - A Flower Collage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/x-icon" href="images/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #1a1a1a;
      color: #eee;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* ---- left sidebar ---- */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: #111;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem 2rem;
      z-index: 10;
      border-right: 1px solid rgba(255,255,255,0.06);
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .title {
      font-family: 'Caveat', cursive;
      font-size: 2.1rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .title .phooling {
      color: #ff8fa3;
    }

    .title .around {
      color: #ffd166;
    }

    .counter {
      display: inline-block;
      background: rgba(255,255,255,0.08);
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 0.3rem 0.9rem;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.55);
      font-weight: 600;
      letter-spacing: 0.02em;
      width: fit-content;
    }

    /* ---- filters ---- */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .filter-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .filter-pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.55);
      padding: 0.25rem 0.65rem;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-pill:hover { background: rgba(255,255,255,0.12); }

    .filter-pill.active {
      background: rgba(255,255,255,0.88);
      color: #111;
      border-color: rgba(255,255,255,0.88);
    }

    .filter-pill.active[data-value="Spring"] {
      background: #a8d5a2;
      color: #1a3a18;
      border-color: #a8d5a2;
    }

    .filter-pill.active[data-value="Summer"] {
      background: #ffd166;
      color: #3a2e0a;
      border-color: #ffd166;
    }

    .filter-pill.active[data-value="Monsoon"] {
      background: #7ec8e3;
      color: #0e2f3d;
      border-color: #7ec8e3;
    }

    .filter-pill.active[data-value="Year-round"] {
      background: #d4a5e5;
      color: #2a1535;
      border-color: #d4a5e5;
    }

    /* ---- sidebar footer ---- */
    .sidebar-bottom {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    footer {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      line-height: 1.5;
    }

    footer a {
      color: #c0392b;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px dashed rgba(192,57,43,0.4);
      transition: border-color 0.2s;
    }

    footer a:hover { border-bottom-style: solid; }

    /* ---- image grid ---- */
    .collage {
      margin-left: 240px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      min-height: 100vh;
    }

    .flower-card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 3 / 4;
      background: #222;
    }

    .flower-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .flower-card:hover img {
      transform: scale(1.08);
    }

    .flower-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 2.5rem 1rem 0.8rem;
      background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, transparent 100%);
      z-index: 1;
    }

    .flower-label .flower-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    .flower-label .flower-hindi {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.8);
      margin-top: 0.1rem;
    }

    .flower-label .flower-latin {
      font-size: 0.72rem;
      font-style: italic;
      color: rgba(255,255,255,0.6);
      margin-top: 0.1rem;
    }

    .flower-label .flower-location {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.5);
      margin-top: 0.15rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .flower-label .flower-location::before {
      content: '\1F4CD';
      font-size: 0.6rem;
    }

    /* hover info panel */
    .flower-info {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #fdf6e3 0%, #f8edd0 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.8rem 1.3rem;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 3;
    }

    .flower-card:hover .flower-info,
    .flower-card.active .flower-info {
      opacity: 1;
    }

    .flower-info .info-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #6a4a18;
      margin-bottom: 0.1rem;
    }

    .flower-info .info-hindi {
      font-size: 0.9rem;
      color: #8a6a30;
      margin-bottom: 0.1rem;
    }

    .flower-info .info-latin {
      font-size: 0.78rem;
      font-style: italic;
      color: #a08848;
      margin-bottom: 0.8rem;
    }

    .flower-info .info-season {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #fae9a0;
      color: #4a3010;
      border-radius: 16px;
      padding: 0.25rem 0.7rem;
      font-size: 0.72rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      width: fit-content;
    }

    .flower-info .info-season::before { content: '☀'; }

    .flower-info .info-location {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(100,80,30,0.12);
      color: #5a4418;
      border-radius: 16px;
      padding: 0.25rem 0.7rem;
      font-size: 0.72rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
      width: fit-content;
    }

    .flower-info .info-location::before {
      content: '\1F4CD';
      font-size: 0.65rem;
    }

    .flower-info .info-desc {
      font-size: 0.82rem;
      line-height: 1.6;
      color: #4a3a20;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: rgba(255,255,255,0.5);
      font-size: 1rem;
    }

    /* ---- modal ---- */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #fdf6e3;
      border-radius: 18px;
      overflow: hidden;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border: 3px solid rgba(255,255,255,0.1);
      position: relative;
    }

    .modal img {
      width: 100%;
      max-height: 50vh;
      object-fit: cover;
    }

    .modal-body {
      padding: 1.5rem 2rem 2rem;
    }

    .modal-body .modal-flower-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #6a4a18;
      margin-bottom: 0.1rem;
    }

    .modal-body .modal-flower-hindi {
      font-size: 1rem;
      color: #8a6a30;
      margin-bottom: 0.1rem;
    }

    .modal-body .modal-flower-latin {
      font-size: 0.88rem;
      font-style: italic;
      color: #a08848;
      margin-bottom: 1rem;
    }

    .modal-body .modal-flower-season {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #fae9a0;
      color: #4a3010;
      border-radius: 16px;
      padding: 0.35rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .modal-body .modal-flower-season::before { content: '☀'; }

    .modal-body .modal-flower-location {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(100,80,30,0.12);
      color: #5a4418;
      border-radius: 16px;
      padding: 0.35rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 1rem;
      margin-left: 0.5rem;
    }

    .modal-body .modal-flower-location::before {
      content: '\1F4CD';
      font-size: 0.75rem;
    }

    .modal-body .modal-flower-desc {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #4a3a20;
    }

    .modal-close {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      background: rgba(253,246,227,0.9);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(180,150,80,0.2);
      color: #6a4a18;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 102;
      transition: background 0.2s, transform 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .modal-close:hover {
      background: #fff;
      transform: scale(1.08);
    }

    /* ---- responsive: collapse sidebar on small screens ---- */
    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      .sidebar {
        position: relative;
        width: 100%;
        padding: 1.5rem 1.5rem;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        flex-direction: column;
        gap: 1rem;
      }
      .sidebar-top { gap: 1rem; }
      .collage { margin-left: 0; grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 500px) {
      .collage { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-top">
        <h1 class="title"><span class="phooling">Phooling</span> <span class="around">Around</span></h1>
        <div class="counter" id="counter"></div>
        <div class="controls" id="controls"></div>
      </div>
      <div class="sidebar-bottom">
        <footer>Created by Claude because <a target="__blank" href="https://x.com/talrejajeee">@talrejajeee</a> asked it to. 🌸</footer>
      </div>
    </aside>

    <main class="collage" id="collage"></main>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <img id="modalImg" src="" alt="">
      <div class="modal-body">
        <div class="modal-flower-name" id="modalName"></div>
        <div class="modal-flower-hindi" id="modalHindi"></div>
        <div class="modal-flower-latin" id="modalLatin"></div>
        <div style="display:flex;flex-wrap:wrap;gap:0.25rem;">
          <div class="modal-flower-season" id="modalSeason"></div>
          <div class="modal-flower-location" id="modalLocation"></div>
        </div>
        <div class="modal-flower-desc" id="modalDesc"></div>
      </div>
    </div>
  </div>

  <script src="flowers.js"></script>
  <script>
    // ===== Controls: season filter =====
    const seasonCategories = ['Spring', 'Summer', 'Monsoon', 'Year-round'];

    let activeSeason = 'All';
    const controls = document.getElementById('controls');
    controls.innerHTML = `
      <span class="filter-label">Season</span>
      <div class="filter-pills">
        <button class="filter-pill active" data-value="All">All</button>
        ${seasonCategories.map(s => `<button class="filter-pill" data-value="${s}">${s}</button>`).join('')}
      </div>
    `;

    controls.addEventListener('click', (e) => {
      const pill = e.target.closest('.filter-pill');
      if (!pill) return;
      activeSeason = pill.dataset.value;
      controls.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      applyFilters();
    });

    function getFilteredFlowers() {
      return flowers.filter(f => {
        return activeSeason === 'All' || f.season.toLowerCase().includes(activeSeason.toLowerCase());
      });
    }

    function applyFilters() {
      const filtered = getFilteredFlowers();
      const cards = collage.querySelectorAll('.flower-card');
      cards.forEach((card, i) => {
        card.style.display = filtered.includes(flowers[i]) ? '' : 'none';
      });

      const noRes = collage.querySelector('.no-results');
      if (filtered.length === 0) {
        if (!noRes) {
          const msg = document.createElement('div');
          msg.className = 'no-results';
          msg.textContent = 'No flowers match this filter.';
          collage.appendChild(msg);
        }
      } else if (noRes) {
        noRes.remove();
      }

      document.getElementById('counter').textContent = filtered.length === flowers.length
        ? `🌼 ${flowers.length} and counting`
        : `🌼 ${filtered.length} of ${flowers.length} flowers`;
    }

    // ===== Shuffle & build flower cards =====
    for (let i = flowers.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [flowers[i], flowers[j]] = [flowers[j], flowers[i]];
    }

    document.getElementById("counter").textContent = `🌼 ${flowers.length} and counting`;

    const collage = document.getElementById("collage");
    const modal = document.getElementById("modal");
    const modalClose = document.getElementById("modalClose");

    flowers.forEach((flower) => {
      const card = document.createElement("div");
      card.className = "flower-card";
      card.innerHTML = `
        <img src="${flower.img}" alt="${flower.name}" loading="lazy">
        <div class="flower-label">
          <div class="flower-name">${flower.name}</div>
          <div class="flower-hindi">${flower.hindi}</div>
          <div class="flower-latin">${flower.latin}</div>
          <div class="flower-location">${flower.location}</div>
        </div>
        <div class="flower-info">
          <div class="info-name">${flower.name}</div>
          <div class="info-hindi">${flower.hindi}</div>
          <div class="info-latin">${flower.latin}</div>
          <div class="info-season">${flower.season}</div>
          <div class="info-location">${flower.location}</div>
          <div class="info-desc">${flower.desc}</div>
        </div>
      `;
      card.addEventListener("click", () => openModal(flower));
      collage.appendChild(card);
    });

    function openModal(flower) {
      document.getElementById("modalImg").src = flower.img;
      document.getElementById("modalImg").alt = flower.name;
      document.getElementById("modalName").textContent = flower.name;
      document.getElementById("modalHindi").textContent = flower.hindi;
      document.getElementById("modalLatin").textContent = flower.latin;
      document.getElementById("modalSeason").textContent = flower.season;
      document.getElementById("modalLocation").textContent = flower.location;
      document.getElementById("modalDesc").textContent = flower.desc;
      modal.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      modal.classList.remove("open");
      document.body.style.overflow = "";
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });
  </script>

</body>
</html>
